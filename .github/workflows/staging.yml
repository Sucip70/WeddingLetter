# Push ke branch `staging` (atau jalankan manual) -> tes -> bangun image API & Web ke GHCR -> deploy ke VPS staging.
# Persiapan (secrets, variables, server): deploy/staging/README.md.
name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Satu deploy staging berjalan pada satu waktu; deploy berikutnya menunggu (tidak membatalkan yang sedang jalan).
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Tes & tipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm workspaces: satu lockfile di root untuk API & Web.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: API — prisma generate
        working-directory: apps/api
        run: npm run prisma:generate
      - name: API — tipe
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: API — unit test
        working-directory: apps/api
        run: npm test

      # Tipe rute (PageProps<'/…'>) biasanya dibuat next dev/build di .next/; di CI dibuat tanpa build penuh.
      - name: Web — tipe
        working-directory: apps/web
        run: npx next typegen && npx tsc --noEmit
      - name: Web — lint
        working-directory: apps/web
        run: npx eslint src

  build:
    name: Image ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      # Nama image GHCR wajib huruf kecil.
      - name: Nama image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weddingletter-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # Konteks = root repo (lockfile workspaces); .dockerignore root membatasi isinya.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:staging-${{ github.sha }}
          # Hanya dipakai image web (NEXT_PUBLIC_* ditanam saat build); diabaikan image API.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
          cache-from: type=gha,scope=staging-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.app }}

  deploy:
    name: Deploy ke VPS
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      REMOTE_DIR: weddingletter-staging
    steps:
      - uses: actions/checkout@v4
      - name: Kunci SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # Hanya berkas konfigurasi dari repo; .env, api.env, certs/ dan htpasswd tetap milik server.
      - name: Salin konfigurasi
        run: |
          ssh "$SSH_TARGET" "mkdir -p $REMOTE_DIR/nginx"
          scp deploy/staging/docker-compose.yml "$SSH_TARGET:$REMOTE_DIR/docker-compose.yml"
          scp -r deploy/staging/nginx/templates deploy/staging/nginx/cloudflare-realip.conf "$SSH_TARGET:$REMOTE_DIR/nginx/"
      - name: Tarik image & jalankan
        run: |
          ssh "$SSH_TARGET" "cd $REMOTE_DIR && export TAG=staging-${{ github.sha }} \
            && docker compose pull api web \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
      - name: Cek kesehatan
        run: |
          ssh "$SSH_TARGET" "cd $REMOTE_DIR && for i in \$(seq 1 30); do \
            [ \"\$(docker inspect -f '{{.State.Health.Status}}' \$(docker compose ps -q api))\" = healthy ] && exit 0; sleep 5; done; \
            docker compose logs --tail=80 api; exit 1"
