name: weddingletter-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_USER: weddingletter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD production}
      POSTGRES_DB: weddingletter_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingletter -d weddingletter_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?isi API_IMAGE}:${TAG:?deploy memakai tag production-<sha>}
    restart: unless-stopped
    mem_limit: 384m
    env_file: api.env
    environment:
      DATABASE_URL: postgresql://weddingletter:${POSTGRES_PASSWORD}@postgres:5432/weddingletter_production?schema=public
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      APP_PORT: "4000"
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      ingress:
        aliases: [production-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  web:
    image: ${WEB_IMAGE:?isi WEB_IMAGE}:${TAG:?deploy memakai tag production-<sha>}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      API_URL: http://api:4000
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      ingress:
        aliases: [production-web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *logging

volumes:
  pgdata:

networks:
  ingress:
    external: true
    name: weddingletter-production-ingress
